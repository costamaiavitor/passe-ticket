# Roda os testes a cada envio para o GitHub. Se algo quebrar, o commit fica com um X vermelho.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (testes + tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  site:
    name: Site (tipos + testes + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build
