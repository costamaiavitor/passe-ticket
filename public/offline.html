<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BooTickets â€” sem internet</title>
<style>
  :root { --bg:#090B0F; --card:#171A21; --line:#262A33; --text:#F4F4F6; --muted:#9AA0AC; --primary:#A03DFD; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 24px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:22px; margin:0; }
  .tag { font-size:12px; color:var(--muted); }
  .warn { margin:16px 0 20px; padding:12px 14px; border-radius:12px; background:#2A1F0A; color:#F5C451; font-size:14px; line-height:1.45; }
  button { font:inherit; border:0; border-radius:12px; padding:12px 16px; min-height:44px; background:var(--primary); color:#fff; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin:0 0 4px; }
  .meta { font-size:13px; color:var(--muted); margin:2px 0; }
  .qr { display:block; width:100%; max-width:280px; margin:14px auto 8px; background:#fff; border-radius:12px; padding:10px; }
  .used { text-align:center; color:var(--muted); padding:28px 0; }
  .empty { color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>Meus ingressos</h1>
  <button id="retry" type="button">Tentar de novo</button>
</header>
<p class="warn">VocÃª estÃ¡ sem internet. Os ingressos abaixo ficaram guardados no celular e o QR Code vale na entrada normalmente. <span id="saved"></span></p>
<main id="list"><p class="empty">Carregandoâ€¦</p></main>
<script>
  // PÃ¡gina local do app: aparece quando o site nÃ£o abre (sem sinal). LÃª os ingressos que o site guardou
  // no celular da Ãºltima vez que a pessoa abriu "Meus ingressos" com internet.
  document.getElementById("retry").addEventListener("click", function () { window.location.href = "/ingressos"; });
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(iso) {
    try { return new Date(iso).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "America/Fortaleza" }); }
    catch (e) { return iso; }
  }
  async function load() {
    var list = document.getElementById("list");
    // Lê o que o site guardou neste aparelho (app instalado pelo navegador ou app das lojas).
    var raw = null;
    try { raw = window.localStorage.getItem("bt-offline-tickets"); } catch (e) { raw = null; }
    var prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
    if (!raw && prefs) { var r = await prefs.get({ key: "bt-offline-tickets" }); raw = r && r.value; }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || !data.tickets || !data.tickets.length) {
      list.innerHTML = '<p class="empty">Nenhum ingresso guardado ainda. Abra "Meus ingressos" com internet uma vez e eles passam a ficar disponÃ­veis aqui, mesmo sem sinal.</p>';
      return;
    }
    if (data.savedAt) document.getElementById("saved").textContent = "Atualizado em " + when(data.savedAt) + ".";
    list.innerHTML = data.tickets.map(function (t) {
      return '<article class="card">' +
        '<h2>' + esc(t.title) + '</h2>' +
        '<p class="meta">' + esc(when(t.startsAt)) + '</p>' +
        '<p class="meta">' + esc(t.venue) + ', ' + esc(t.city) + '</p>' +
        (t.qr ? '<img class="qr" alt="QR Code do ingresso" src="' + esc(t.qr) + '">' : '<p class="used">Ingresso jÃ¡ utilizado</p>') +
        '<p class="meta">Titular: ' + esc(t.holderName) + ' Â· ' + esc(t.batchName) + '</p>' +
        '</article>';
    }).join("");
  }
  load();
</script>
</body>
</html>
